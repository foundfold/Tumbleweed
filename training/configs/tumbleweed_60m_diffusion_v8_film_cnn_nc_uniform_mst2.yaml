run_id: tumbleweed_60m_diffusion_v8_film_cnn_nc_uniform_mst2  # nc + uniform-t control arm

# T-SCHEDULE ABLATION — control arm (Arm B).
# Identical in every way to tumbleweed_60m_diffusion_v8_film_cnn_nc_mst2 (the released nc model,
# Arm A) EXCEPT the diffusion noise level is sampled t ~ U(0,1) per sequence instead of being set
# by the SELEX selection round (t = 1 - round_k / r_max). This isolates the headline mechanism:
# Arm A (selex_round) vs Arm B (uniform) under matched architecture (FiLM+CNN), corpus, and steps.
# If RecoveryBench / own−zero for Arm A > Arm B, the SELEX-round→noise-schedule coupling is the
# load-bearing contribution; if Arm A ≈ Arm B, it is a principled design choice that does not move
# the recovery metric (reframe, do not headline). See train_diffusion_hybrid.py t_schedule flag.
data:
  families:
  - name: rapt_tg2
    rounds_glob: ~/Desktop/autoRNA_data/tumbleweed/raptranker/PRJDB9110_TG2/processed/DRR*.parquet
    target_uniprot: P21980      # TGM2
    chemistry: RNA
    r_max: 8

  - name: rapt_a
    rounds_glob: ~/Desktop/autoRNA_data/tumbleweed/raptscore_selex/processed/A_R*.parquet
    target_uniprot: P31371      # FGF9
    chemistry: RNA
    r_max: 6

  - name: rapt_b
    rounds_glob: ~/Desktop/autoRNA_data/tumbleweed/raptscore_selex/processed/B_R*.parquet
    target_uniprot: P14719      # ST2/IL-33R (mouse Il1rl1) — RaptScore Dataset B TRUE target (was mislabeled human Q01638)
    chemistry: RNA
    r_max: 7

  - name: rapt_c
    rounds_glob: ~/Desktop/autoRNA_data/tumbleweed/raptscore_selex/processed/C_R*.parquet
    target_uniprot: P31371      # FGF9 (independent campaign)
    chemistry: RNA
    r_max: 7

  - name: rapidselex_parp1
    rounds_glob: ~/Desktop/autoRNA_data/tumbleweed/rapidselex/processed/rapidselex_PARP1_R*.parquet
    target_uniprot: P09874      # PARP1
    chemistry: RNA
    r_max: 12

  - name: rapidselex_mecp2
    rounds_glob: ~/Desktop/autoRNA_data/tumbleweed/rapidselex/processed/rapidselex_MECP2_R*.parquet
    target_uniprot: P51608      # MECP2
    chemistry: RNA
    r_max: 12

  - name: alphasyn_s1
    rounds_glob: ~/Desktop/autoRNA_data/tumbleweed/alphasyn/processed/alphasyn_S1_R*.parquet
    target_uniprot: P37840      # SNCA (alpha-synuclein); 2'F-pyrimidine RNA
    chemistry: RNA
    r_max: 15

  target_embeddings_parquet: ~/Tumbleweed/data_refs/target_protein_embeddings_centered.parquet
  winners_parquet: ~/Tumbleweed/data_refs/kdbench_winners_hybrid.parquet
  winner_round: 4
  winner_r_max: 5
  winner_repeat: 50
  max_rows_per_family: 50000
  ckpt_dir: ~/Desktop/autoRNA_data/tumbleweed/training_runs

model:
  d_model: 768
  nhead: 12
  num_layers: 8
  dim_ff: 3072
  dropout: 0.1
  embed_dim: 256
  max_len: 96
  target_embed_dim: 1280
  use_target_token: true
  target_film: true
  cnn_kernels: [5, 7]           # v15-style motif front-end on denoiser input (matched to Arm A)
  grad_checkpoint: false

training:
  batch_size: 128
  steps: 20000
  lr: 3.0e-4
  weight_decay: 0.05
  betas: [0.9, 0.95]
  grad_clip: 1.0
  amp: true
  lam_diff: 0.5
  lam_contrast: 0.0           # contrastive term OFF (matched to Arm A)
  mask_same_target: true
  t_schedule: uniform        # ← ONLY difference vs Arm A: round-agnostic t ~ U(0,1)
  ckpt_every: 2500
